---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {}
  name: healthignorerules.health.harvesterhci.io
spec:
  group: health.harvesterhci.io
  names:
    kind: HealthIgnoreRule
    listKind: HealthIgnoreRuleList
    plural: healthignorerules
    singular: healthignorerule
  scope: Cluster
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          HealthIgnoreRule tells the controller to mark the matching checks of a ComponentHealth as ignored.
          The checks are kept in the ComponentHealth status, so the ignore decision can be reverted and audited,
          but they no longer count in the HealthSummary.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              checkKey:
                description: CheckKey is the key of the check in the ComponentHealth
                  status.
                minLength: 1
                type: string
              componentHealth:
                description: ComponentHealth is the name of the ComponentHealth that
                  owns the check, e.g. harvester-controller-volume.
                minLength: 1
                type: string
              expiresAt:
                description: ExpiresAt is the time the rule stops taking effect. The
                  rule never expires when it is not set.
                format: date-time
                type: string
              reason:
                description: Reason tells why the check is ignored.
                type: string
              resources:
                description: |-
                  Resources limits the rule to these affected resources of the check, which are named the same as
                  status.checks[].affectedResources.names. The whole check is ignored when it is empty.
                items:
                  type: string
                type: array
            required:
            - checkKey
            - componentHealth
            type: object
        type: object
    served: true
    storage: true
