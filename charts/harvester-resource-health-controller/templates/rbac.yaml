apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "harvester-resource-health-controller.name" . }}
rules:
- apiGroups: [ "apiextensions.k8s.io" ]
  resources: [ "customresourcedefinitions" ]
  verbs: [ "get", "watch", "list", "update", "patch", "create" ]
# CRs owned by this addon
- apiGroups: [ "health.harvesterhci.io" ]
  resources: [ "componenthealths", "healthsummaries", "healthignorerules" ]
  verbs: [ "*" ]
# resources that are checked
- apiGroups: [ "harvesterhci.io" ]
  resources: [ "virtualmachinebackups", "schedulevmbackups", "virtualmachineimages", "upgrades", "addons", "supportbundles", "upgradelogs", "volumeremotebackups", "volumeremoterestores" ]
  verbs: [ "get", "watch", "list" ]
- apiGroups: [ "" ]
  resources: [ "nodes" ]
  verbs: [ "get", "watch", "list" ]
- apiGroups: [ "kubevirt.io" ]
  resources: [ "virtualmachineinstances" ]
  verbs: [ "get", "watch", "list" ]
- apiGroups: [ "longhorn.io" ]
  resources: [ "volumes" ]
  verbs: [ "get", "watch", "list" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "harvester-resource-health-controller.name" . }}
  labels:
  {{- include "harvester-resource-health-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "harvester-resource-health-controller.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "harvester-resource-health-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "harvester-resource-health-controller.name" . }}-lease-manager
  namespace: kube-system
rules:
- apiGroups: [ "" ]
  resources: [ "configmaps" ]
  verbs: [ "get", "watch", "list", "update", "create" ]
- apiGroups: [ "coordination.k8s.io" ]
  resources: [ "leases" ]
  verbs: [ "get", "watch", "list", "update", "create" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "harvester-resource-health-controller.name" . }}-manage-leases
  namespace: kube-system
  labels:
  {{- include "harvester-resource-health-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "harvester-resource-health-controller.name" . }}-lease-manager
subjects:
- kind: ServiceAccount
  name: {{ include "harvester-resource-health-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
