# Default values for harvester-network-controller.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# global is populated by the parent chart when this is deployed as a
# subchart dependency (e.g. ipFamilyPolicy set based on how the cluster's
# IP families were configured at install time).
#  Sub value `.ipFamilyPolicy` controls the IP family policy used by the controller and managed components.
#  Passed to the controller and webhook runtime containers via the IP_FAMILY_POLICY environment variable.
#
#  Supported values (same as Kubernetes Service.spec.ipFamilyPolicy):
#    - SingleStack     (default; matches historical/IPv4-only behavior)
#    - PreferDualStack (requires IPv4-first dual-stack hosts with the kernel IPv6 stack enabled)
#
#  Note: When configured as PreferDualStack, it indicates the host is installed in
#  dual-IPv4-first mode with the kernel IPv6 stack enabled. Under this policy,
#  the controller runtime can safely assume the host IP stack is dual-stack (IPv4+IPv6).
#  This awareness is important for network-controller.
#
#  CRITICAL: Install the Harvester cluster step by step. The host network stack is decided
#  at that installation stage once and must never be changed independently or separately
#  afterwards. A mismatched or malformed configuration will break system networking.
global: {}

image:
  repository: rancher/harvester-network-controller
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

nameOverride: ""

# Specify whether to enable VIP, defaults to false
vipEnabled: false

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations:
  # this toleration is to have the daemonset runnable on master nodes
  # remove it if your masters can't run pods
  - key: node-role.kubernetes.io/master
    effect: NoSchedule

affinity: {}

# Default value for harvester-network-controller-manager deployment
manager:
  replicas: 2
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - harvester-network-controller-manager
        topologyKey: kubernetes.io/hostname

helper:
  # Helper image version is used in the harvester-network-controller codes as the job's template image.
  image:
    repository: rancher/harvester-network-helper
    tag: ""

webhook:
  replicas: 1
  image:
    repository: rancher/harvester-network-webhook
    tag: ""
    pullPolicy: IfNotPresent
  httpsPort: 8443
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
