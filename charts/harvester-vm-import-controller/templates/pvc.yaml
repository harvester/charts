{{- if .Values.pvcClaim.enabled -}}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "vm-import-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vm-import-controller.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem 
  resources:
    requests:
      storage: {{ .Values.pvcClaim.size | quote }}
{{- $storageClassName := .Values.pvcClaim.storageClassName | default "" }}
{{- $storageClass := .Values.pvcClaim.storageClass | default "" }}

{{- /* Prefer storageClassName, falling back to the legacy storageClass when unset or "-". */}}
{{- $resolvedStorageClass := $storageClassName }}
{{- if or (not $resolvedStorageClass) (eq $resolvedStorageClass "-") }}
  {{- if $storageClass }}
    {{- $resolvedStorageClass = $storageClass }}
  {{- end }}
{{- end }}

{{- if eq $resolvedStorageClass "-" }}
  storageClassName: ""
{{- else if $resolvedStorageClass }}
  storageClassName: {{ $resolvedStorageClass | quote }}
{{- end }}
{{- end }}
