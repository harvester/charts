apiVersion: management.cattle.io/v3
builtin: false
context: project
displayName: View Virtualization Resources
external: false
hidden: false
kind: RoleTemplate
metadata:
  labels:
  {{- include "harvester-rbac.labels" . | nindent 4 }}
  name: virt-project-view
roleTemplateNames:
  - read-only
  - monitoring-ui-view
rules:
{{- include "harvester-rbac.projectViewRules" . }}
  {{- with .Values.projectRole.virtProjectView.additionalRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
